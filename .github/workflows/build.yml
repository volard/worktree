name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: workdocker
            archive: workdocker-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: workdocker
            archive: workdocker-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary: workdocker
            archive: workdocker-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary: workdocker
            archive: workdocker-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            binary: workdocker.exe
            archive: workdocker-windows-amd64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p package dist
          go build -trimpath -ldflags="-s -w" -o "package/${{ matrix.binary }}" .
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd package && zip -q "../dist/${{ matrix.archive }}" "${{ matrix.binary }}")
          else
            tar -C package -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: workdocker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v5
        with:
          pattern: workdocker-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum workdocker-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "workdocker $GITHUB_REF_NAME"
